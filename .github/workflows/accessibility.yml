name: Accessibility checking

on:
  pull_request:
    paths:
      - 'src/**'

jobs:
  axe:
    name: axe
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup node
        uses: actions/setup-node@v6
      - name: Install chrome
        run: npx browser-driver-manager install chrome@150
      - name: Serve src
        working-directory: src
        run: npx serve & npx wait-on http://localhost:3000
      - name: Run axe
        run: npx @axe-core/cli http://localhost:3000 --exit
